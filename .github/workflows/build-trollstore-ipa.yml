name: Build TrollStore IPA

# 用途：在 GitHub Actions 的 macOS runner 上编译 Jev Jarvis，
#       用 ldid 伪签名，打包成 TrollStore 可直接安装的 IPA。
#       产物在 Actions 页签 → Artifacts → JevJarvis-trollstore-ipa 下载。

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "编译配置"
        required: false
        default: "Release"
        type: choice
        options: [Release, Debug]
  push:
    tags:
      - "ipa-*"

permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "---- available Xcodes ----"
          ls -1 /Applications | grep -i '^Xcode' || true
          xcodebuild -version
          sw_vers

      - name: Install ldid
        run: |
          brew install ldid
          ldid 2>&1 | head -2 || true

      - name: Build (unsigned)
        run: |
          set -uo pipefail

          # 依次尝试可用的 Xcode。README 说本工程用 Xcode 27 验证编译，
          # 但代码里没有 iOS 17+/26 专属 API（Swift 5 模式、deployment target 16.0），
          # 所以较旧的 Xcode 16/15 也能编过。
          #
          # 关键：切到某个 Xcode 之前必须先确认它装了 iOS 平台 SDK。
          # runner 镜像上并存多个 Xcode，但只有一部分带 iOS 平台，
          # 缺平台的那个会报 "iOS 18.x is not installed" 或
          # actool 的 simulator runtime 错配——那不是代码问题，
          # 继续换下一个 Xcode 只会浪费配额。
          XCODE_LIST=$(ls -1d /Applications/Xcode*.app 2>/dev/null | sort -V)
          [ -z "$XCODE_LIST" ] && XCODE_LIST="/Applications/Xcode.app"

          BUILD_OK=0
          for XC in $XCODE_LIST; do
            echo "===================================================================="
            echo ">>> Trying Xcode: $XC"
            echo "===================================================================="

            # 该 Xcode 是否带可用的 iOS 平台 SDK？
            PLAT_DIRS=$(ls -1d "$XC/Contents/Developer/Platforms/iPhoneOS.platform" 2>/dev/null)
            if [ -z "$PLAT_DIRS" ]; then
              echo "!!! Skipped: no iPhoneOS platform bundled with this Xcode"
              continue
            fi
            # SDK 版本必须与该 Xcode 匹配；用 xcodebuild -showsdks 交叉确认
            if ! xcodebuild -showsdks 2>/dev/null | grep -q "iphoneos"; then
              echo "!!! Skipped: no iphoneos SDK available for this Xcode"
              continue
            fi

            sudo xcode-select -s "$XC"
            xcodebuild -version
            xcodebuild -showsdks 2>/dev/null | grep -i iphoneos || true

            rm -rf build

            # DEVELOPMENT_TEAM 必须清空 —— 仓库里硬编码了作者的团队 ID (75LZ93U5CF)，
            # 在没有该账号证书的 CI 上会导致签名失败。
            # CODE_SIGNING_ALLOWED=NO 产出未签名二进制，后续由 ldid 伪签名。
            xcodebuild \
              -project JevJarvis.xcodeproj \
              -scheme JevJarvis \
              -configuration "${{ inputs.configuration || 'Release' }}" \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              ENABLE_BITCODE=NO \
              build && { BUILD_OK=1; break; }

            echo "!!! Build failed with $XC, trying next Xcode..."
          done

          if [ "$BUILD_OK" -ne 1 ]; then
            echo "::error::All Xcode versions failed to build"
            exit 1
          fi
          echo "Build succeeded."

      - name: Verify build output
        run: |
          set -euo pipefail
          ls -la build/Build/Products/*/JevJarvis.app
          echo "---- embedded extensions ----"
          ls -la build/Build/Products/*/JevJarvis.app/PlugIns/ 2>/dev/null \
            || echo "WARN: PlugIns 目录缺失，打包脚本会尝试兜底补入"

      - name: Package fakesigned IPA
        run: |
          set -euo pipefail
          bash scripts/build_trollstore_ipa.sh

      - name: Checksum
        run: |
          shasum -a 256 out/JevJarvis-trollstore.ipa | tee out/SHA256SUMS.txt

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JevJarvis-trollstore-ipa
          path: |
            out/JevJarvis-trollstore.ipa
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
